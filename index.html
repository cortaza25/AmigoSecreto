<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amigo Secreto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #0f172a;
    --texto: #f8fafc;
    --suave: #cbd5e1;
    --acento: #ffd166;
    --rosa: #ef476f;
    --naranja: #f78c6b;
    --tarjeta: rgba(255, 255, 255, 0.08);
    --borde: rgba(255, 255, 255, 0.16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: 'Fredoka', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: var(--texto);
    background: radial-gradient(circle at 50% -10%, #3b2f8f 0%, #1e1b4b 35%, var(--fondo) 75%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 480px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 2rem; margin: 0 0 4px; text-align: center; letter-spacing: 0.5px; }
  .evento { text-align: center; color: var(--acento); margin: 0 0 28px; font-weight: 600; }
  .pregunta { text-align: center; color: var(--suave); margin: 0 0 12px; font-size: 1.05rem; }

  /* ---- Chips de nombres ---- */
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 24px; }
  .chip {
    font: inherit; font-size: 1rem; font-weight: 600;
    padding: 10px 18px; border-radius: 999px; cursor: pointer;
    color: var(--texto); background: var(--tarjeta); border: 1.5px solid var(--borde);
    transition: transform .12s ease, background .12s ease, color .12s ease;
  }
  .chip:hover { transform: translateY(-2px); background: rgba(255,255,255,0.14); }
  .chip.activo { background: var(--acento); color: #1e1b4b; border-color: var(--acento); }

  /* ---- Formularios de PIN ---- */
  form { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  label { color: var(--suave); font-size: .95rem; }
  input.pin {
    font: inherit; font-size: 1.8rem; letter-spacing: 12px; text-align: center; width: 220px;
    padding: 10px 0 10px 12px; border-radius: 14px; border: 2px solid var(--borde);
    background: rgba(0,0,0,0.25); color: var(--texto); outline: none;
  }
  input.pin:focus { border-color: var(--acento); }
  .sacudir { animation: sacudir .4s ease; }
  @keyframes sacudir { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  .error { color: #fda4af; min-height: 1.4em; margin: 0; font-size: .95rem; text-align: center; line-height: 1.4; }

  /* ---- Botones ---- */
  .boton {
    font: inherit; font-size: 1.2rem; font-weight: 700; cursor: pointer; border: none;
    padding: 14px 32px; border-radius: 999px; color: #fff;
    background: linear-gradient(135deg, var(--rosa), var(--naranja));
    box-shadow: 0 8px 24px rgba(239, 71, 111, 0.35);
    transition: transform .12s ease, box-shadow .12s ease, opacity .2s;
  }
  .boton:hover:not(:disabled) { transform: translateY(-2px) scale(1.02); box-shadow: 0 12px 28px rgba(239,71,111,.45); }
  .boton:disabled { opacity: .55; cursor: default; }
  .boton.secundario {
    background: transparent; color: var(--suave); box-shadow: none;
    border: 1.5px solid var(--borde); font-size: .95rem; padding: 8px 16px; font-weight: 600;
  }
  .enlace-boton {
    font: inherit; background: none; border: none; color: var(--suave); cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px; font-size: .95rem; padding: 6px;
  }
  .enlace-boton:hover { color: var(--acento); }

  /* ---- Pantalla de la ruleta ---- */
  .cabecera { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .cabecera span { font-size: 1.25rem; font-weight: 600; }
  .ruleta-contenedor { position: relative; width: min(88vw, 400px); margin: 0 auto 26px; }
  .puntero {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%); z-index: 3;
    width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent;
    border-top: 34px solid var(--acento); filter: drop-shadow(0 3px 4px rgba(0,0,0,.4));
  }
  canvas#ruleta {
    display: block; width: 100%; aspect-ratio: 1; border-radius: 50%;
    box-shadow: 0 0 0 8px rgba(255,255,255,0.06), 0 18px 50px rgba(0,0,0,.5);
    will-change: transform;
  }
  .centro {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2;
    width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center;
    font-size: 30px; background: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.35);
  }
  .acciones { text-align: center; }
  .pie { text-align: center; margin-top: 22px; }

  /* ---- Tarjetas ---- */
  .tarjeta {
    margin-top: 22px; padding: 22px 20px; border-radius: 20px; text-align: center;
    background: #fff; color: #1e1b4b; box-shadow: 0 16px 40px rgba(0,0,0,.4);
    animation: aparecer .5s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes aparecer { from { opacity: 0; transform: scale(.85) translateY(10px); } }
  .tarjeta p { margin: 0; }
  .tarjeta .titulo { text-transform: uppercase; letter-spacing: 2px; font-size: .8rem; color: #64748b; }
  .tarjeta .amigo { font-size: 2.2rem; font-weight: 700; color: var(--rosa); margin: 6px 0 10px; word-break: break-word; }
  .tarjeta .nota { color: #475569; font-size: .95rem; line-height: 1.5; }
  .tarjeta h2 { margin: 0 0 8px; font-size: 1.4rem; }
  .tarjeta form { margin-top: 16px; }
  .tarjeta label { color: #64748b; }
  .tarjeta input.pin { background: #f1f5f9; color: #1e1b4b; border-color: #cbd5e1; }
  .tarjeta input.pin:focus { border-color: var(--rosa); }
  .tarjeta .boton.secundario { color: #64748b; border-color: #cbd5e1; margin-top: 10px; }

  .notificacion {
    margin: 0 0 18px; padding: 12px 14px; border-radius: 14px; line-height: 1.5; font-size: .95rem;
    background: rgba(255,209,102,.14); border: 1.5px solid rgba(255,209,102,.45);
  }
  .aviso { text-align: center; color: var(--suave); line-height: 1.6; }
  .aviso a { color: var(--acento); }
  .cargando { text-align: center; color: var(--suave); padding: 40px 0; }

  canvas#confeti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="app">

  <!-- Pantalla 1: elegir nombre + PIN -->
  <section id="pantalla-entrar">
    <h1>🎁 Amigo Secreto</h1>
    <p class="evento" id="nombre-evento"></p>
    <p class="cargando" id="cargando">Cargando…</p>
    <p class="pregunta" id="pregunta" hidden>¿Quién eres?</p>
    <div id="lista-nombres" class="chips"></div>
    <form id="form-pin" hidden autocomplete="off">
      <label for="pin">Escribe tu PIN</label>
      <input id="pin" class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" required>
      <p class="error" id="error"></p>
      <button class="boton" type="submit">Entrar</button>
    </form>
    <p class="aviso" id="aviso" hidden></p>
  </section>

  <!-- Pantalla 2: crear / cambiar PIN personal -->
  <section id="pantalla-pin" hidden>
    <div class="cabecera">
      <span id="saludo-pin"></span>
      <button class="boton secundario" id="pin-cancelar" type="button">Cancelar</button>
    </div>
    <div class="tarjeta">
      <h2>🔒 Tu PIN personal</h2>
      <p class="nota" id="pin-explicacion"></p>
      <form id="form-nuevo-pin" autocomplete="off">
        <label for="pin-nuevo">Nuevo PIN (4 a 6 números)</label>
        <input id="pin-nuevo" class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" required>
        <label for="pin-nuevo2">Repítelo</label>
        <input id="pin-nuevo2" class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" required>
        <p class="error" id="pin-error"></p>
        <button class="boton" type="submit" id="pin-guardar">Guardar mi PIN</button>
      </form>
      <button class="boton secundario" id="pin-omitir" type="button">Seguir con el PIN del organizador</button>
    </div>
  </section>

  <!-- Pantalla 3: ruleta -->
  <section id="pantalla-ruleta" hidden>
    <div class="cabecera">
      <span id="saludo"></span>
      <button class="boton secundario" id="salir" type="button">Salir</button>
    </div>
    <p class="notificacion" id="aviso-reinicio" hidden></p>
    <div class="ruleta-contenedor">
      <div class="puntero"></div>
      <canvas id="ruleta"></canvas>
      <div class="centro">🎁</div>
    </div>
    <div class="acciones">
      <button class="boton" id="girar" type="button">¡Girar la ruleta!</button>
    </div>
    <div class="tarjeta" id="resultado" hidden>
      <p class="titulo">Tu amigo secreto es</p>
      <p class="amigo" id="amigo"></p>
      <p class="nota" id="nota"></p>
    </div>
    <p class="pie"><button class="enlace-boton" id="cambiar-pin" type="button">🔒 Cambiar mi PIN</button></p>
  </section>

</main>
<canvas id="confeti" hidden></canvas>

<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc, writeBatch, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';

const db = getFirestore(initializeApp(window.FIREBASE_CONFIG));
const $ = (s) => document.querySelector(s);
const COLORES = ['#ef476f', '#ffd166', '#06d6a0', '#118ab2', '#f78c6b', '#9b5de5', '#00bbf9', '#f15bb5'];
const DOS_PI = Math.PI * 2;

// ---- Frases ----
const FRASES_PIN_MALO = [
  (n) => `🤨 Mmm… tú no eres ${n}. ¿O sí? Porque ${n} sí se sabe su PIN. 😏`,
  (n) => `🙅 ¡No, no, no! Ese PIN no abre nada. Si de verdad eres ${n}, inténtalo otra vez.`,
  (n) => `🕵️ Sospechoso… muy sospechoso. Ese no es el PIN de ${n}.`,
];
const FRASE_TERCER_INTENTO = (n) => `😅 Tranquilo, respira. Si eres ${n} y de verdad lo olvidaste, pídele al organizador que reinicie tu PIN.`;
const FRASE_CADUCADO = (n) => `🙅‍♂️ ¡No, no, no! Ese código ya lo usó ${n} y caducó. Aquí no hay nada que ver, circule. 🕵️`;
const FRASE_REINICIADO = (n, fecha) => `🔄 El organizador reinició el PIN de ${n} el ${fecha}. Entra con el código original que te envió.`;
const FRASE_NO_VALIDO = (n) => `🙅 Ese PIN ya no es válido para ${n}. Si es tuyo y no entiendes por qué, pregúntale al organizador.`;

const idEvento = new URLSearchParams(location.hash.slice(1)).get('e');
let evento = null;   // { nombre, participantes: [...] }
let yo = null;       // nombre seleccionado
let pinActual = '';  // PIN con el que entró
let tipoPin = '';    // 'invitacion' | 'personal'
let amigo = null;    // nombre descifrado
let secretos = null; // { nonceGiro, nonceCambio } (viajan cifrados con el PIN)
let infoPin = null;  // pines/{yo}: { personal, cambiado, reiniciado }
let yaGiro = false;
let otros = [];      // nombres en la ruleta (todos menos yo)
let rotacion = 0;
let girando = false;
let intentos = 0;

const ordenar = (lista) => [...lista].sort((a, b) => a.localeCompare(b, 'es'));
const ref = (...partes) => doc(db, 'eventos', idEvento, ...partes);
const fechaBonita = (ts) => ts && ts.toDate ? ts.toDate().toLocaleString('es', { dateStyle: 'short', timeStyle: 'short' }) : '';

// Solo números en todos los campos de PIN
document.querySelectorAll('input.pin').forEach((input) => {
  input.addEventListener('input', () => { input.value = input.value.replace(/\D/g, ''); });
});

function avisar(html) {
  $('#cargando').hidden = true;
  $('#aviso').innerHTML = html;
  $('#aviso').hidden = false;
}

function sacudir(input) {
  input.classList.remove('sacudir'); void input.offsetWidth; input.classList.add('sacudir');
  input.select();
}

function mostrarPantalla(id) {
  ['pantalla-entrar', 'pantalla-pin', 'pantalla-ruleta'].forEach((p) => { $('#' + p).hidden = p !== id; });
}

// ============ Pantalla de entrada ============
async function iniciar() {
  if (!idEvento) {
    avisar('Este enlace no tiene ningún juego.<br>Pídele al organizador el enlace correcto, o <a href="admin.html">crea uno nuevo</a>.');
    return;
  }
  let snap;
  try {
    snap = await AS.conTiempo(getDoc(ref()), 15000);
  } catch (err) {
    avisar(AS.MENSAJE_SIN_CONEXION);
    return;
  }
  if (!snap.exists()) {
    avisar('No existe ningún juego con este enlace.<br>Revisa que lo hayas copiado completo.');
    return;
  }
  evento = snap.data();
  $('#nombre-evento').textContent = evento.nombre || '';
  $('#cargando').hidden = true;
  $('#pregunta').hidden = false;

  const lista = $('#lista-nombres');
  for (const nombre of ordenar(evento.participantes)) {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.textContent = nombre;
    chip.addEventListener('click', () => seleccionar(nombre, chip));
    lista.appendChild(chip);
  }
}

function seleccionar(nombre, chip) {
  yo = nombre;
  intentos = 0;
  document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('activo', c === chip));
  $('#form-pin').hidden = false;
  $('#error').textContent = '';
  $('#pin').value = '';
  $('#pin').focus();
}

$('#form-pin').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pin = $('#pin').value.trim();
  if (!yo || !pin) return;
  const boton = e.target.querySelector('button');
  boton.disabled = true;
  boton.textContent = 'Verificando…';
  $('#error').textContent = '';
  try {
    // Del PIN salen el token (dónde está mi asignación) y la clave (cómo descifrarla)
    const { token, clave } = await AS.derivar(pin, AS.salt(idEvento, yo));
    let snap;
    try {
      snap = await AS.conTiempo(getDoc(ref('asignaciones', token)), 15000);
    } catch (err) {
      if (err.code === 'permission-denied') throw new Error('no-valido'); // existe, pero ya no está vigente
      throw err;
    }
    if (!snap.exists()) throw new Error('pin');

    const contenido = JSON.parse(await AS.descifrar(snap.data(), clave));
    amigo = contenido.amigo;
    secretos = { nonceGiro: contenido.nonceGiro, nonceCambio: contenido.nonceCambio };
    tipoPin = snap.data().tipo;
    pinActual = pin;

    const [estado, pines] = await AS.conTiempo(Promise.all([getDoc(ref('estado', yo)), getDoc(ref('pines', yo))]), 15000);
    yaGiro = estado.exists();
    infoPin = pines.exists() ? pines.data() : {};
    intentos = 0;

    // Primera vez con el código del organizador: proponer un PIN personal
    if (tipoPin === 'invitacion' && !infoPin.personal) mostrarCrearPin(true);
    else entrar();
  } catch (err) {
    const input = $('#pin');
    if (err.message === 'pin' || err.name === 'OperationError') {
      intentos++;
      $('#error').textContent = intentos >= 3 ? FRASE_TERCER_INTENTO(yo) : FRASES_PIN_MALO[(intentos - 1) % FRASES_PIN_MALO.length](yo);
      sacudir(input);
    } else if (err.message === 'no-valido') {
      $('#error').textContent = await fraseNoValido();
      sacudir(input);
    } else if (err.message === 'sin-conexion') {
      $('#error').textContent = AS.MENSAJE_SIN_CONEXION;
    } else {
      $('#error').textContent = 'Error: ' + err.message;
    }
  } finally {
    boton.disabled = false;
    boton.textContent = 'Entrar';
  }
});

// El PIN existe pero ya no está vigente: ¿fue porque la persona creó uno personal, o porque lo reiniciaron?
async function fraseNoValido() {
  try {
    const pines = await getDoc(ref('pines', yo));
    const info = pines.exists() ? pines.data() : {};
    if (info.personal) return FRASE_CADUCADO(yo);
    if (info.reiniciado) return FRASE_REINICIADO(yo, fechaBonita(info.reiniciado));
  } catch {}
  return FRASE_NO_VALIDO(yo);
}

// ============ Pantalla de PIN personal ============
let primeraVez = false;

function mostrarCrearPin(esPrimeraVez) {
  primeraVez = esPrimeraVez;
  $('#saludo-pin').textContent = 'Hola, ' + yo + ' 👋';
  $('#pin-explicacion').textContent = tipoPin === 'invitacion'
    ? 'El PIN con el que entraste te lo envió el organizador, así que él también lo conoce. Crea uno que solo tú sepas y el suyo dejará de funcionar.'
    : 'Elige tu nuevo PIN. El anterior dejará de funcionar.';
  $('#pin-cancelar').hidden = esPrimeraVez;
  $('#pin-omitir').hidden = !esPrimeraVez;
  $('#pin-nuevo').value = '';
  $('#pin-nuevo2').value = '';
  $('#pin-error').textContent = '';
  mostrarPantalla('pantalla-pin');
  $('#pin-nuevo').focus();
}

$('#pin-omitir').addEventListener('click', entrar);
$('#pin-cancelar').addEventListener('click', entrar);
$('#cambiar-pin').addEventListener('click', () => mostrarCrearPin(false));

$('#form-nuevo-pin').addEventListener('submit', async (e) => {
  e.preventDefault();
  const nuevo = $('#pin-nuevo').value.trim();
  const repetido = $('#pin-nuevo2').value.trim();
  const error = $('#pin-error');
  error.textContent = '';
  if (!/^\d{4,6}$/.test(nuevo)) { error.textContent = 'El PIN debe tener entre 4 y 6 números.'; sacudir($('#pin-nuevo')); return; }
  if (nuevo !== repetido) { error.textContent = 'Los dos PIN no coinciden.'; sacudir($('#pin-nuevo2')); return; }
  if (nuevo === pinActual) { error.textContent = 'Ese es el PIN que ya tienes. Elige uno diferente.'; sacudir($('#pin-nuevo')); return; }

  const boton = $('#pin-guardar');
  boton.disabled = true;
  boton.textContent = 'Guardando…';
  try {
    const { token, clave } = await AS.derivar(nuevo, AS.salt(idEvento, yo));
    const cifrado = await AS.cifrar(JSON.stringify({ amigo, ...secretos }), clave);
    // Todo en una sola operación: nueva asignación cifrada + control apunta a ella + estado público
    const lote = writeBatch(db);
    lote.set(ref('asignaciones', token), { nombre: yo, tipo: 'personal', ...cifrado });
    lote.update(ref('control', yo), { activo: 'personal', tokenPersonal: token, prueba: secretos.nonceCambio, cambiado: serverTimestamp() });
    lote.set(ref('pines', yo), { personal: true, cambiado: serverTimestamp() });
    await AS.conTiempo(lote.commit(), 20000);

    pinActual = nuevo;
    tipoPin = 'personal';
    infoPin = { personal: true };
    entrar('🔒 ¡Listo! Tu PIN personal quedó guardado. Ahora solo tú puedes entrar. No lo olvides 😉');
  } catch (err) {
    error.textContent = err.message === 'sin-conexion' ? AS.MENSAJE_SIN_CONEXION
      : err.code === 'permission-denied' ? 'Ese PIN no se puede usar. Prueba con otro.'
      : 'No se pudo guardar: ' + err.message;
  } finally {
    boton.disabled = false;
    boton.textContent = 'Guardar mi PIN';
  }
});

// ============ Pantalla de la ruleta ============
function entrar(mensaje) {
  otros = ordenar(evento.participantes.filter((n) => n !== yo));
  if (!otros.includes(amigo)) {
    mostrarPantalla('pantalla-entrar');
    $('#error').textContent = 'El sorteo parece dañado. Avísale al organizador.';
    return;
  }
  $('#saludo').textContent = 'Hola, ' + yo + ' 👋';

  const aviso = $('#aviso-reinicio');
  if (typeof mensaje === 'string') {
    aviso.textContent = mensaje;
    aviso.hidden = false;
  } else if (tipoPin === 'invitacion' && infoPin.reiniciado) {
    aviso.textContent = '🔄 El organizador reinició tu PIN el ' + fechaBonita(infoPin.reiniciado) + '. Si no lo pediste tú, pregúntale qué pasó 👀. Puedes crear uno nuevo abajo.';
    aviso.hidden = false;
  } else {
    aviso.hidden = true;
  }

  mostrarPantalla('pantalla-ruleta');

  if (yaGiro) {
    // Ya giró (desde este u otro dispositivo): la ruleta aparece quieta apuntando a su amigo.
    rotacion = anguloFinal(otros.indexOf(amigo), 0, 0);
    dibujarRuleta();
    mostrarResultado('Ya giraste anteriormente, así que la ruleta no se puede volver a girar. ¡Guarda el secreto! 🤫');
  } else {
    rotacion = 0;
    dibujarRuleta();
    $('#girar').hidden = false;
    $('#girar').disabled = false;
    $('#resultado').hidden = true;
  }
}

$('#salir').addEventListener('click', () => {
  yo = amigo = secretos = infoPin = null;
  pinActual = tipoPin = '';
  otros = [];
  mostrarPantalla('pantalla-entrar');
  $('#form-pin').hidden = true;
  $('#error').textContent = '';
  document.querySelectorAll('.chip').forEach((c) => c.classList.remove('activo'));
});

$('#girar').addEventListener('click', girar);

// ---- Dibujo de la ruleta ----
const lienzo = $('#ruleta');

function dibujarRuleta() {
  const tam = lienzo.clientWidth;
  if (!tam) return;
  const dpr = window.devicePixelRatio || 1;
  lienzo.width = tam * dpr;
  lienzo.height = tam * dpr;
  const ctx = lienzo.getContext('2d');
  ctx.scale(dpr, dpr);

  const r = tam / 2;
  const n = otros.length;
  const seg = DOS_PI / n;
  const fuenteMax = Math.max(10, Math.min(22, 0.5 * r * seg));
  const anchoTexto = r - 18 - 44; // desde el borde hasta el botón central

  otros.forEach((nombre, i) => {
    const ini = i * seg;
    // Evita que el último y el primero queden del mismo color al cerrar el círculo
    let color = COLORES[i % COLORES.length];
    if (i === n - 1 && n > 1 && color === COLORES[0]) color = COLORES[1];

    ctx.beginPath();
    ctx.moveTo(r, r);
    ctx.arc(r, r, r - 4, ini, ini + seg);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Nombre escrito a lo largo del radio
    ctx.save();
    ctx.translate(r, r);
    ctx.rotate(ini + seg / 2);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#1e1b4b';
    ctx.fillText(ajustar(ctx, nombre, anchoTexto, fuenteMax), r - 18, 0);
    ctx.restore();
  });

  ctx.beginPath();
  ctx.arc(r, r, r - 3, 0, DOS_PI);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 6;
  ctx.stroke();

  aplicarRotacion();
}

// Reduce la fuente hasta que el nombre quepa (mínimo 11px) y, si aun así no cabe, lo recorta.
function ajustar(ctx, texto, ancho, fuenteMax) {
  for (let f = fuenteMax; f >= 11; f -= 1) {
    ctx.font = '600 ' + f + 'px Fredoka, system-ui, sans-serif';
    if (ctx.measureText(texto).width <= ancho) return texto;
  }
  let t = texto;
  while (t.length > 1 && ctx.measureText(t + '…').width > ancho) t = t.slice(0, -1);
  return t + '…';
}

function aplicarRotacion() {
  lienzo.style.transform = 'rotate(' + rotacion + 'rad)';
}

window.addEventListener('resize', () => { if (!$('#pantalla-ruleta').hidden && !girando) dibujarRuleta(); });

// Rotación necesaria para que el segmento `indice` quede bajo el puntero (arriba, -π/2).
function anguloFinal(indice, vueltas, desvio) {
  const seg = DOS_PI / otros.length;
  const objetivo = -Math.PI / 2 - (indice + 0.5) * seg + desvio;
  const base = ((objetivo % DOS_PI) + DOS_PI) % DOS_PI;
  return vueltas * DOS_PI + base;
}

function segmentoBajoPuntero() {
  const seg = DOS_PI / otros.length;
  const local = (((-Math.PI / 2 - rotacion) % DOS_PI) + DOS_PI) % DOS_PI;
  return Math.floor(local / seg);
}

// ---- Giro ----
function girar() {
  if (girando) return;
  girando = true;
  $('#girar').disabled = true;
  $('#girar').textContent = 'Girando…';

  const seg = DOS_PI / otros.length;
  const desvio = (Math.random() - 0.5) * seg * 0.7;       // no cae siempre en el centro exacto
  const vueltas = 6 + AS.aleatorio(3);
  const inicio = rotacion % DOS_PI;
  const destino = anguloFinal(otros.indexOf(amigo), vueltas, desvio);
  const duracion = 5500;
  const t0 = performance.now();
  let ultimoSeg = segmentoBajoPuntero();
  let ultimoTic = 0;

  function paso(ahora) {
    const t = Math.min(1, (ahora - t0) / duracion);
    const e = 1 - Math.pow(1 - t, 4); // frena suave al final
    rotacion = inicio + (destino - inicio) * e;
    aplicarRotacion();

    const s = segmentoBajoPuntero();
    if (s !== ultimoSeg && ahora - ultimoTic > 40) { ultimoSeg = s; ultimoTic = ahora; tic(); }

    if (t < 1) requestAnimationFrame(paso);
    else terminarGiro();
  }
  requestAnimationFrame(paso);
}

async function terminarGiro() {
  girando = false;
  tada();
  confeti();
  let nota = 'La ruleta ya no se puede volver a girar. ¡Guarda el secreto! 🤫';
  try {
    // Registra en la nube que ya giró; solo se acepta porque presentamos el secreto.
    await AS.conTiempo(setDoc(ref('estado', yo), { giro: true, fecha: serverTimestamp(), prueba: secretos.nonceGiro }), 15000);
    yaGiro = true;
  } catch (err) {
    if (err.code !== 'permission-denied') nota += ' (No se pudo registrar en línea, revisa tu conexión.)';
  }
  mostrarResultado(nota);
}

function mostrarResultado(nota) {
  $('#girar').hidden = true;
  $('#girar').textContent = '¡Girar la ruleta!';
  $('#amigo').textContent = amigo;
  $('#nota').textContent = nota;
  $('#resultado').hidden = false;
}

// ---- Sonidos (Web Audio; si falla, se ignora) ----
let audio;
function contexto() {
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  return audio;
}
function nota(freq, inicio, dur, tipo, vol) {
  const a = contexto();
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = tipo || 'square';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.03, a.currentTime + inicio);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + inicio + dur);
  o.connect(g).connect(a.destination);
  o.start(a.currentTime + inicio);
  o.stop(a.currentTime + inicio + dur);
}
function tic() { try { nota(900, 0, 0.05); } catch {} }
function tada() {
  try { [523, 659, 784, 1047].forEach((f, i) => nota(f, i * 0.12, 0.5, 'triangle', 0.08)); } catch {}
}

// ---- Confeti ----
function confeti() {
  const c = $('#confeti');
  const ctx = c.getContext('2d');
  c.width = innerWidth;
  c.height = innerHeight;
  c.hidden = false;
  const piezas = Array.from({ length: 160 }, () => ({
    x: Math.random() * c.width,
    y: -20 - Math.random() * c.height * 0.4,
    vx: (Math.random() - 0.5) * 3,
    vy: 2 + Math.random() * 4,
    w: 6 + Math.random() * 6,
    h: 8 + Math.random() * 8,
    rot: Math.random() * Math.PI,
    vr: (Math.random() - 0.5) * 0.25,
    color: COLORES[Math.floor(Math.random() * COLORES.length)],
  }));
  const t0 = performance.now();
  (function paso(ahora) {
    ctx.clearRect(0, 0, c.width, c.height);
    let vivos = 0;
    for (const p of piezas) {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vy += 0.03;
      if (p.y < c.height + 20) vivos++;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (vivos > 0 && ahora - t0 < 7000) requestAnimationFrame(paso);
    else { ctx.clearRect(0, 0, c.width, c.height); c.hidden = true; }
  })(t0);
}

iniciar();
</script>
